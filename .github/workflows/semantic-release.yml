name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      # Pinned together. conventional-changelog-conventionalcommits 10.4.0 requires
      # conventional-changelog-writer 9, but @semantic-release/release-notes-generator
      # (14.1.1, the latest) still depends on writer ^8, so an unpinned install fails
      # at generateNotes with "Missing helper". Bump both once the notes generator
      # ships writer 9.
      - name: Install conventional commits preset
        run: npm install --no-save conventional-changelog-conventionalcommits@10.3.0
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release@25.0.9