name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      # Pinned together. @semantic-release/release-notes-generator (14.1.1, the latest)
      # depends on conventional-changelog-writer ^8. Preset v10 targets writer 9:
      # 10.4.0 fails generateNotes with "Missing helper", 10.0-10.3 render an empty
      # changelog. Stay on preset 9.x until the notes generator ships writer 9.
      - name: Install conventional commits preset
        run: npm install --no-save conventional-changelog-conventionalcommits@9.3.1
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release@25.0.9